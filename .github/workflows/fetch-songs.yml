name: Songs von fcstpauli.com laden

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [claude/fc-st-pauli-song-app-54z6te]
    paths: [.github/workflows/fetch-songs.yml, scripts/**]

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-songs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Songs laden
        run: node scripts/scrape.mjs
      - name: Debug-Seiten
        run: |
          mkdir -p data/sample
          for id in n0096 n0099 n0196 k0011; do curl -sSL -o data/sample/$id.html "https://www.fcstpauli.com/spsc/der-st-pauli-song-contest-deine-stimme-wird-gebraucht/$id"; done
      - name: CORS der MP3-Dateien prüfen
        run: |
          url=$(node -e 'const d=require("./app/songs.json");console.log(d.songs.find(s=>s.audio.length).audio[0])')
          echo "$url"
          curl -sSI -H "Origin: https://callahit.github.io" "$url" | grep -iE '^(HTTP|access-control|content-type|content-length|accept-ranges)' || true
      - name: Änderungen committen
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/songs.json data
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Song-Daten von fcstpauli.com aktualisieren"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: App neu veröffentlichen
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}" || echo "Pages-Workflow nicht gestartet"
